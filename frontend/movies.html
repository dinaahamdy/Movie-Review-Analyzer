<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Movies - MovieMind</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/movies.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><span>✨</span> MovieMind</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="movies.html">Explore Movies</a></li>
                <li><a href="write-review.html">Write a Review</a></li>
                <li><a href="sentiment.html">Sentiment Insights</a></li>
                <li><a href="about-nlp.html">About NLP</a></li>
            </ul>
        </nav>
    </header>

    <main class="movies-page">
        <div class="page-header">
            <h1>The Grand Archive</h1>
            <p>Search, filter, and discover magical stories.</p>
        </div>
        
        <div class="controls-bar">
            <input type="text" id="searchInput" placeholder="Search by title...">
            <select id="genreFilter">
                <option value="All">All Genres</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Adventure">Adventure</option>
                <option value="Drama">Drama</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Romance">Romance</option>
                <option value="Thriller">Thriller</option>
                <option value="Animation">Animation</option>
            </select>
            <select id="sortOrder">
                <option value="newest">Newest Release</option>
                <option value="titleAZ">Title A-Z</option>
                <option value="titleZA">Title Z-A</option>
                <option value="highestRated">Highest Rated</option>
                <option value="mostReviewed">Most Reviewed</option>
            </select>
            <button id="clearFiltersBtn" class="btn btn-outline">Clear</button>
        </div>

        <div id="moviesGrid" class="movie-grid">
            <!-- Rendered by JS -->
        </div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>No magical tomes found.</h2>
            <p>Try adjusting your search or clearing the filters.</p>
        </div>
    </main>
    <footer><p>&copy; 2026 MovieMind. An educational NLP frontend project.</p></footer>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="js/movies.js"></script>
</body>
</html>
